<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="logo">
            <h1>RecipeBox</h1>
        </div>
        <nav class="nav-links">
            <button id="theme-toggle" class="btn-icon" aria-label="Toggle Dark Mode">🌙</button>
            <div id="auth-nav-items">
                <button id="nav-dashboard" class="nav-btn">Dashboard</button>
                <button id="nav-add-recipe" class="nav-btn primary">Add Recipe</button>
            </div>
        </nav>
    </header>

    <main class="app-container">

        <!-- 2. Dashboard / Recipe Grid View -->
        <section id="view-dashboard" class="view-section active">
            <div class="dashboard-header">
                <h2>My Recipes</h2>
                <div class="search-filter-bar">
                    <input type="text" id="search-input" class="search-input" placeholder="Search recipes or ingredients...">
                    <select id="filter-category" class="filter-select">
                        <option value="">All Categories</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Vegan">Vegan</option>
                    </select>
                    <select id="filter-time" class="filter-select">
                        <option value="">Max Time: Any</option>
                        <option value="15">Under 15 mins</option>
                        <option value="30">Under 30 mins</option>
                        <option value="60">Under 60 mins</option>
                        <option value="120">Under 2 hours</option>
                    </select>
                </div>
            </div>

            <div id="recipe-grid" class="recipe-grid">
                <!-- Recipe Cards will be dynamically injected here -->
            </div>
            <div id="dashboard-loading" class="loading-spinner" style="display: none;">Loading recipes...</div>
            <div id="dashboard-empty" class="empty-state" style="display: none;">
                <p>No recipes found. Start adding some!</p>
            </div>
        </section>


        <!-- 3. Add/Edit Recipe Engine View -->
        <section id="view-recipe-form" class="view-section" style="display: none;">
            <div class="form-header">
                <button id="btn-back-from-form" class="btn-icon">← Back</button>
                <h2 id="form-view-title">Add New Recipe</h2>
            </div>

            <form id="recipe-form" class="recipe-form-card">
                <input type="hidden" id="recipe-id-input">

                <div class="form-row">
                    <div class="form-group flex-2">
                        <label for="recipe-title">Title *</label>
                        <input type="text" id="recipe-title" required placeholder="E.g., Classic Spaghetti Bolognese">
                    </div>
                    <div class="form-group flex-1">
                        <label for="recipe-difficulty">Difficulty</label>
                        <select id="recipe-difficulty">
                            <option value="Easy">Easy</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="recipe-description">Description</label>
                    <textarea id="recipe-description" rows="3" placeholder="A short description of this delicious recipe..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="recipe-prep-time">Prep Time (mins)</label>
                        <input type="number" id="recipe-prep-time" min="0" placeholder="15">
                    </div>
                    <div class="form-group">
                        <label for="recipe-cook-time">Cook Time (mins)</label>
                        <input type="number" id="recipe-cook-time" min="0" placeholder="45">
                    </div>
                    <div class="form-group">
                        <label for="recipe-servings">Servings</label>
                        <input type="number" id="recipe-servings" min="1" placeholder="4">
                    </div>
                </div>

                <div class="form-group">
                    <label for="recipe-image">Cover Image (URL or Base64)</label>
                    <input type="text" id="recipe-image" placeholder="https://example.com/image.jpg">
                    <input type="file" id="recipe-image-upload" accept="image/*" style="margin-top: 8px;">
                </div>

                <div class="form-group">
                    <label for="recipe-tags">Tags (comma separated)</label>
                    <input type="text" id="recipe-tags" placeholder="Dinner, Pasta, Italian">
                </div>

                <hr class="divider">

                <div class="dynamic-section">
                    <div class="section-header">
                        <h3>Ingredients</h3>
                        <button type="button" id="btn-add-ingredient" class="btn-secondary small">+ Add Ingredient</button>
                    </div>
                    <div id="ingredients-container" class="dynamic-list">
                        <!-- Ingredient rows injected here -->
                    </div>
                </div>

                <hr class="divider">

                <div class="dynamic-section">
                    <div class="section-header">
                        <h3>Instructions</h3>
                        <button type="button" id="btn-add-instruction" class="btn-secondary small">+ Add Step</button>
                    </div>
                    <div id="instructions-container" class="dynamic-list">
                        <!-- Instruction rows injected here -->
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="btn-cancel-form" class="btn-outline">Cancel</button>
                    <button type="submit" id="btn-save-recipe" class="btn-primary">Save Recipe</button>
                </div>
            </form>
        </section>


        <!-- 4. Detailed Recipe View -->
        <section id="view-recipe-detail" class="view-section" style="display: none;">
            <div class="detail-header">
                <button id="btn-back-from-detail" class="btn-icon">← Back</button>
                <div class="detail-actions">
                    <button id="btn-edit-recipe" class="btn-outline">Edit</button>
                    <button id="btn-delete-recipe" class="btn-danger">Delete</button>
                </div>
            </div>

            <article class="recipe-detail-card">
                <div class="recipe-hero">
                    <img id="detail-image" src="" alt="Recipe Cover" style="display: none;">
                    <div class="recipe-hero-content">
                        <h1 id="detail-title">Recipe Title</h1>
                        <p id="detail-description">Description goes here.</p>
                        <div class="recipe-meta-tags" id="detail-tags">
                            <!-- Tags injected here -->
                        </div>
                    </div>
                </div>

                <div class="recipe-meta-bar">
                    <div class="meta-item">
                        <span class="meta-label">Prep Time</span>
                        <span class="meta-value" id="detail-prep">--</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Cook Time</span>
                        <span class="meta-value" id="detail-cook">--</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Servings</span>
                        <span class="meta-value" id="detail-servings">--</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Difficulty</span>
                        <span class="meta-value badge" id="detail-difficulty">--</span>
                    </div>
                </div>

                <div class="recipe-content-grid">
                    <div class="ingredients-section">
                        <h3>Ingredients</h3>
                        <ul id="detail-ingredients-list" class="checklist">
                            <!-- Checkbox ingredients injected here -->
                        </ul>
                    </div>

                    <div class="instructions-section">
                        <h3>Instructions</h3>
                        <ol id="detail-instructions-list" class="step-list">
                            <!-- Ordered steps injected here -->
                        </ol>
                    </div>
                </div>
            </article>
        </section>

    </main>

    <!-- App Logic -->
    <script src="app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>
</html>
